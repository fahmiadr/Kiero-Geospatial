<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Full Map Simulator</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        #controls,
        #auth-controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #results {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 100px;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }

        iframe {
            border: 2px solid #000;
            width: 100%;
            height: 600px;
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <h1>Iframe Full Map Simulator</h1>

    <div id="controls" class="disabled">
        <label for="phoneNumber">Enter Phone Number:</label>
        <input type="text" id="phoneNumber" placeholder="e.g., 213456" />
        <button id="searchButton">Search Prefix</button>
    </div>

    <h2>Data Received from Iframe:</h2>
    <pre id="results">Waiting for iframe to initialize...</pre>

    <iframe id="mapIframe"
        src="./map-iframe-full?provinsi=Jawa+Barat&kabkota=Purwakarta&kecamatan=Pasawahan&desakel=Pasawahan&zoom=13"></iframe>

    <script>
        const searchButton = document.getElementById('searchButton');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const resultsContainer = document.getElementById('results');
        const mapIframe = document.getElementById('mapIframe');
        const controlsDiv = document.getElementById('controls');

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.source !== 'mapIframeApp') return;

            if (data.type === 'iframeReady') {
                resultsContainer.textContent = 'Iframe child "Ready" received. Sending "init" back...';
                if (mapIframe.contentWindow) {
                    mapIframe.contentWindow.postMessage({
                        action: 'init'
                    }, '*'); // Gunakan target origin spesifik di produksi
                }
                return;
            }

            resultsContainer.textContent = JSON.stringify(data, null, 2);

            if (data.type === 'initialized') {
                controlsDiv.classList.remove('disabled');
            } else if (data.type === 'auth_error') {
                controlsDiv.classList.add('disabled');
            }
        });

        // 3. Add click listener for prefix search
        searchButton.addEventListener('click', () => {
            const phoneNumber = phoneNumberInput.value;
            if (phoneNumber && mapIframe.contentWindow) {
                resultsContainer.textContent = `Searching for prefix of ${phoneNumber}...`;
                mapIframe.contentWindow.postMessage({
                    action: 'searchPrefix',
                    payload: { phoneNumber: phoneNumber }
                }, '*');
            }
        });
    </script>
</body>

</html>
