# =============================================================================
# /etc/nginx/sites-available/geospa.conf
# Geomap Platform — Self-Signed SSL Reverse Proxy
# =============================================================================

# ── Frontend (React SPA) — Port 4170 ──────────────────────────────
upstream geospa_app {
    server 127.0.0.1:14170;
    keepalive 1024;
    keepalive_timeout 60s;
}

server {
    listen 4170 quic reuseport;
    listen 4170 ssl reuseport;
    http2 on;
    http3 on;
    server_name _;

    ssl_certificate     /etc/ssl/certs/geospa-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/geospa-selfsigned.key;

    include snippets/security_headers.inc;
    add_header Alt-Svc 'h3=":4170"; ma=86400';

    location / {
        include proxy_params;
        proxy_pass http://geospa_app;
    }
}

# ── API Gateway — Port 3000 ────────────────────────────────────────
upstream geospa_api {
    server 127.0.0.1:13000;
    keepalive 1024;
    keepalive_timeout 60s;
}

server {
    listen 3000 quic reuseport;
    listen 3000 ssl reuseport;
    http2 on;
    http3 on;
    server_name _;

    ssl_certificate     /etc/ssl/certs/geospa-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/geospa-selfsigned.key;

    include snippets/security_headers.inc;
    add_header Alt-Svc 'h3=":3000"; ma=86400';

    location / {
        include proxy_params;
        proxy_pass http://geospa_api;
        proxy_read_timeout 10m;
        proxy_send_timeout 60s;
    }
}
