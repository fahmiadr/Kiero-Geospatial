user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 200000;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    # ── Security Hardening ────────────────────────────────
    server_tokens off; 
    charset utf-8;

    # ── MIME & Optimization ───────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── TCP / Network Optimization ───────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    quic_gso on;
 
    # ── Websocket Proxy Variables ───────────────────────────
    map $http_upgrade $connection_upgrade_base {
        default upgrade;
        ""      "";
    }

    map $http3 $connection_upgrade {
        "h3"    ""; 
        default $connection_upgrade_base;
    }

    map $http3 $active_upgrade {
        "h3"    "";
        default $http_upgrade;
    }

    map $http3 $active_host {
        "h3"    $host;
        default $http_host;
    }

    # ── Buffer Optimization ───────────────────────────────
    client_body_buffer_size   32K;
    client_header_buffer_size  8k;
    client_max_body_size      50M;
    large_client_header_buffers 16 4k;

    # ── Timeouts & Keepalive ───────────────────────────────
    client_body_timeout   12;
    client_header_timeout 12;
    keepalive_timeout     65;
    keepalive_requests  10000;
    send_timeout          10;

    # ── SSL Hardening (Mozilla Intermediate) ──────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_dhparam /etc/nginx/dhparam.pem;

    # ── Gzip Compression (Fallback)──────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 2;
    gzip_min_length 1024; 
    gzip_buffers 32 4k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/csv
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xhtml+xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ── Zstd Compression ──────────────────────────
    zstd on;
    zstd_comp_level 4;
    zstd_min_length 1024; 
    zstd_buffers 32 4k;
    zstd_types
        text/plain
        text/css
        text/xml
        text/csv
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xhtml+xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ── Logging ────────────────────────────────────────────
    # log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                   '$status $body_bytes_sent "$http_referer" '
    #                   '"$http_user_agent" "$http_x_forwarded_for"';

    # access_log /var/log/nginx/access.log main buffer=64k flush=1s;
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # ── Includes ───────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}