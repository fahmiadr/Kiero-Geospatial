# =============================================================================
# Geo Map — Production Docker Compose
#
# 3 services: Gateway, Backend, Frontend
# Network-isolated with frontend (bridge) + backend (internal) segmentation.
# =============================================================================

services:
  # ─── Service 0: Permissions Fixer (Automated Setup) ──────────────────
  perms-fixer:
    image: alpine:3.23
    container_name: perms-fixer
    user: root
    volumes:
      - ./keys:/app/keys
    # Automatically fixes ownership and permissions for the non-root 'appuser' (UID 1001)
    command: >
      /bin/sh -c " chown -R 1001:1001 /app/keys &&  chmod 644 /app/keys/gateway_private.pem && chmod 644 /app/keys/gateway_public.pem && echo '=> Permissions fixed for appuser (1001)'"

  # ─── Service 1: Geo Gateway ──────────────────────────────────────────
  gateway:
    build: ./geo-gateway
    container_name: geo-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-13000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      # Database Connection
      - DATABASE_URL=${GATEWAY_DATABASE_URL}
      # URL Identifiers
      - GATEWAY_URL=${GATEWAY_URL:-http://localhost:3000}
      - RESOURCE_SERVER_URL=${RESOURCE_SERVER_URL:-http://backend:3001}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN}
      # Keys
      - GATEWAY_PRIVATE_KEY_PATH=/app/keys/gateway_private.pem
      - GATEWAY_PUBLIC_KEY_PATH=/app/keys/gateway_public.pem
    volumes:
      - ./keys:/app/keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend
      - backend
    depends_on:
      perms-fixer:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health" ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 192M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Service 2: Backend ──────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: geo-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${BACKEND_DATABASE_URL}
      - GATEWAY_ISSUER_URL=${GATEWAY_URL:-http://localhost:3000}
      - GATEWAY_PUBLIC_KEY_PATH=/app/keys/gateway_public.pem
      - ENABLE_COORDINATE_DEBUG=${ENABLE_COORDINATE_DEBUG:-false}
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - backend
    depends_on:
      perms-fixer:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Service 3: Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
        - VITE_CLIENT_ID=${VITE_CLIENT_ID}
        - VITE_GATEWAY_URL=${GATEWAY_URL:-http://localhost:3000}
        - VITE_APP_BASE_URL=${VITE_APP_BASE_URL:-/}
    container_name: geo-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-14170}:4170"
    networks:
      - frontend
    depends_on:
      gateway:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4170/health" ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── Networks ─────────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
